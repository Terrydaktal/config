# Host tmux settings. Patched XFCE Terminal's misc-prefer-mouse-selection
# makes normal dragging select text; mouse stays on for tmux scrollback.
set -g status off
set -g mouse on
set -g mode-keys emacs
set -g set-titles off
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -g history-limit 1000000
set -as terminal-overrides ',*:smcup@:rmcup@'

# Preserve modified Enter from the patched XFCE Terminal in AI CLI panes.
source-file "$HOME/repos/xfce4-terminal/contrib/tmux-modified-enter.conf"

# Keep Whonix terminals sized correctly through the isolated SSH master.
source-file "/home/lewis/tasks/opsec/vm/whonix/tmux-resize.conf"
