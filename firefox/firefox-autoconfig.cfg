// Shared Firefox AutoConfig. The first line must be a comment.
(() => {
  const { classes: Cc, interfaces: Ci } = Components;
  const directory = Cc["@mozilla.org/file/directory_service;1"]
    .getService(Ci.nsIProperties).get("GreD", Ci.nsIFile);
  const io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
  const loader = Cc["@mozilla.org/moz/jssubscript-loader;1"]
    .getService(Ci.mozIJSSubScriptLoader);
  const features = [
    ["autoconfig/british-dictionary.js", false],
    ["autoconfig/reverse-autoscroll.js", false],
    // BEGIN applicationlauncher audio bridge
    ["applicationlauncher-audio-bridge.js", true],
    // END applicationlauncher audio bridge
  ];

  for (const [relativePath, optional] of features) {
    try {
      const file = directory.clone();
      for (const component of relativePath.split("/")) {
        file.append(component);
      }
      if (optional && !file.exists()) {
        continue;
      }
      loader.loadSubScript(io.newFileURI(file).spec);
    } catch (error) {
      Components.utils.reportError("Firefox AutoConfig " + relativePath + ": " + error);
    }
  }
})();
