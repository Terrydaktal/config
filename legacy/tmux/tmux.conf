# Let XFCE Terminal handle shell selection and scrolling, not tmux copy mode.
# Keep misc-prefer-mouse-selection off: mouse-aware apps still receive clicks.
set -g status off
set -g mouse off
set -g mode-keys emacs

# Explicit keyboard copy mode can still copy to the host Wayland clipboard.
# Normal mouse selection uses XFCE Terminal's own clipboard handling.
set -s copy-command 'wl-copy --type text/plain'
set -s set-clipboard off
set -gw copy-mode-selection-style 'fg=default,bg=default,reverse'

set -g set-titles off
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -g history-limit 1000000
set -as terminal-overrides ',*:smcup@:rmcup@'

# Preserve modified Enter from the patched XFCE Terminal in AI CLI panes.
source-file "$HOME/repos/xfce4-terminal/contrib/tmux-modified-enter.conf"

# Keep Whonix terminals sized correctly through the isolated SSH master.
source-file "/home/lewis/tasks/opsec/vm/whonix/tmux-resize.conf"
