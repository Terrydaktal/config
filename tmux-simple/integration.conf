# Keep desktop clipboard access when a phone has no display environment.
set -g update-environment 'KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE'
set -s copy-command '"$HOME/.local/libexec/tmux/clipboard.sh"'

set-hook -g client-attached {
    run-shell -b '"$HOME/.local/libexec/tmux/attach-environment.sh" #{q:socket_path} #{q:client_pid} #{q:session_id}'
    run-shell -b '"$HOME/.local/bin/tmux-mosh" --socket #{q:socket_path} ensure'
}
set-hook -g after-new-session {
    run-shell -b '"$HOME/.local/libexec/tmux/attach-environment.sh" #{q:socket_path} #{q:client_pid} #{q:session_id}'
    run-shell -b '"$HOME/.local/bin/tmux-mosh" --socket #{q:socket_path} ensure'
}
