# Simplified controls for the patched tmux binary.
set -g @tmux-simple 1
set -g status off
set -g prefix None
set -g prefix2 None
unbind -a -T root
unbind -a -T prefix
unbind -a -T copy-mode
unbind -a -T copy-mode-vi
set -g mouse on
set -g scroll-on-input on
set -g mode-keys emacs
set -g history-limit 100000
# Follow the interacting/resizing viewer, not the other viewer's shorter screen.
set -g window-size latest
set -g fill-character ' '
set -g destroy-unattached off
set -s exit-unattached off
set -g remain-on-exit off
set -g allow-rename off
# Format Codex from the pane's real directory, not its abbreviated project suffix.
# E expands these bounded, acyclic formats in-process; no #() commands run per frame.
set -g @codex-title-cwd '#{s!^#{HOME}(/|$)!~\1!:pane_current_path}'
# List Codex's ten frames explicitly: tmux's regex collation rejects Unicode ranges.
set -g @codex-title-frames "\u280b\u2819\u2839\u2838\u283c\u2834\u2826\u2827\u2807\u280f"
set -g @codex-title-clean '#{s/[#{@codex-title-frames}] *//g:pane_title}'
set -g @codex-title-body '#{E;s/^\[ [.!] \] Action Required( \| | - | )?//;s/ - / | /g:@codex-title-clean}'
set -g @codex-title-enabled '#{||:#{m:codex*,#{pane_current_command}},#{m/r:^codex( \| | )[~/],#{E:@codex-title-body}}}'
set -g @codex-title-task '#{?#{m/r:^codex \| [~/],#{E:@codex-title-body}},#{E;s/^codex \| [^|]*( \| |$)//:@codex-title-body},#{?#{m/r:^codex [~/],#{E:@codex-title-body}},#{E;s/^codex [^|]*( \| |$)//:@codex-title-body},#{?#{==:#{E:@codex-title-body},#{b:pane_current_path}},,#{E;s/ \| [^|]*$//:@codex-title-body}}}}'
set -g @codex-title-spinner '#{?#{m/r:[#{@codex-title-frames}],#{pane_title}},#{s/^.*([#{@codex-title-frames}]).*$/\1 /:pane_title},}'
set -g @codex-title-attention '#{?#{m/r:\[ [.!] \] Action Required,#{pane_title}},#{s/^.*(\[ [.!] \] Action Required).*$/\1 /:pane_title},}'
set -g @codex-title-value 'codex: #{E:@codex-title-spinner}#{E:@codex-title-attention}#{E:@codex-title-cwd}#{?#{!=:#{E:@codex-title-task},}, - #{E;s/ \| / - /g:@codex-title-task},}'
set -g set-titles on
set -g set-titles-string 'tmux: #{session_name} - #{?#{E:@codex-title-enabled},#{E:@codex-title-value},#{s/ \| / - /g:pane_title}}'
set -g default-terminal tmux-256color
set -s escape-time 10
set -s extended-keys on
set -s extended-keys-format csi-u
set -g focus-events off
set -as terminal-features ',xterm*:RGB:extkeys:clipboard:hyperlinks'
set -s set-clipboard on
source-file "$HOME/.local/libexec/tmux/integration.conf"
set -g copy-mode-position-format ''
set -g copy-mode-selection-style 'fg=default,bg=default,reverse'

# Keep mouse-aware applications in charge, including ordinary header clicks.
bind -n MouseDown1Pane { send -M }
bind -n MouseUp1Pane { send -M }
bind -n MouseDown2Pane { send -M }
bind -n MouseUp2Pane { send -M }
bind -n MouseDown3Pane { send -M }
bind -n MouseUp3Pane { send -M }
bind -n MouseDrag1Pane { if -F '#{mouse_any_flag}' { send -M } { copy-mode -M -e } }
bind -n MouseDragEnd1Pane { send -M }
bind -n DoubleClick1Pane { if -F '#{mouse_any_flag}' { send -M } { copy-mode -e; send -X select-word } }
bind -n TripleClick1Pane { if -F '#{mouse_any_flag}' { send -M } { copy-mode -e; send -X select-line } }
bind -n WheelUpPane { if -F '#{mouse_any_flag}' { send -M } { copy-mode -e; send -X -N 5 scroll-up } }
bind -n WheelDownPane { if -F '#{mouse_any_flag}' { send -M } }

# Shift+Page keys explicitly browse history, even inside a mouse-aware app.
bind -n S-PageUp { copy-mode -e; send -X page-up }
bind -n S-PageDown { copy-mode -e; send -X page-down }
bind -T copy-mode S-PageUp { send -X page-up }
bind -T copy-mode S-PageDown { send -X page-down }
bind -T copy-mode WheelUpPane { send -X -N 5 scroll-up }
bind -T copy-mode WheelDownPane { send -X -N 5 scroll-down }
bind -T copy-mode MouseDown1Pane { send -X clear-selection }
bind -T copy-mode MouseDrag1Pane { send -X begin-selection }
# Selection never changes the clipboard; Ctrl+C explicitly copies without jumping.
bind -T copy-mode MouseDragEnd1Pane { send -X stop-selection }
bind -T copy-mode DoubleClick1Pane { send -X select-word }
bind -T copy-mode TripleClick1Pane { send -X select-line }
bind -T copy-mode C-c { if -F '#{selection_present}' { send -X copy-pipe-no-clear } { send -X cancel; send C-c } }
